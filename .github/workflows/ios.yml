# Builds the iPhone app on one of GitHub's Macs, so no Mac of your own is needed.
# Run it from the Actions tab: "iOS app" > Run workflow.
#   - Upload off: only checks that the Xcode build works (unsigned, needs no secrets).
#   - Upload on:  signs it for the App Store and uploads it to App Store Connect, where it
#                 shows up under TestFlight. Needs the secret APPLE_SIGNING (docs/development.md,
#                 "App Store builds").
# Pushes to main that change the iOS app run the check by themselves.
name: iOS app

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      # (Not the icon as it's built for xtool's builds: Xcode builds its own.)
      - "!ios/Resources/Assets.car"
      - "!ios/Resources/AppIcon60x60@2x.png"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 (the iOS 27 SDK): App Store Connect requires it from April 2027. GitHub's
    # macos-latest only has Xcode 26; this image is still a preview there. If it misbehaves,
    # macos-latest works until then.
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          bash Tools/xcode-project.sh

      - name: Build (unsigned check)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild build -project Xcode/Phomic.xcodeproj -scheme PhomicApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO
          bash Tools/check-iphone-only.sh "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Phomic.app"

      - name: Install the certificate, profiles and API key
        if: ${{ inputs.upload }}
        env:
          # One secret holding everything, made by ios/Tools/app-store-signing.sh secret.
          APPLE_SIGNING: ${{ secrets.APPLE_SIGNING }}
        run: |
          if [ -z "$APPLE_SIGNING" ]; then
            echo "The APPLE_SIGNING secret is missing: see docs/development.md, App Store builds."
            exit 1
          fi
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          # A pasted secret may carry a stray space or line break; base64 has none.
          printf '%s' "$APPLE_SIGNING" | tr -d '[:space:]' | base64 --decode | tar -xzf - -C "$work"
          p12_password=$(cat "$work/p12-password")
          key_id=$(cat "$work/key-id")
          issuer_id=$(cat "$work/issuer-id")
          # Only the whole secret is masked by itself; xcodebuild prints its arguments.
          echo "::add-mask::$p12_password"
          echo "::add-mask::$key_id"
          echo "::add-mask::$issuer_id"

          # A keychain of its own, unlocked for codesign, with the certificate.
          keychain="$work/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/distribution.p12" -k "$keychain" -P "$p12_password" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$work/distribution.p12" "$work/p12-password"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Keep the certificate's name (on a personal account: your legal name) out of the log;
          # xcodebuild prints it while signing. Logs of a public repo are public.
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^.*"\(.*\)"$/\1/p' | head -1)
          if [ -z "$identity" ]; then echo "No signing identity in the certificate (wrong password?)"; exit 1; fi
          echo "::add-mask::$identity"
          echo "::add-mask::$(printf '%s' "$identity" | sed -E 's/^[^:]*: (.*) \([A-Z0-9]+\)$/\1/')"

          # The App Store profiles, where both older and newer Xcode versions look.
          install_profile() { # $1 = profile file, $2 = environment variable for its name
            security cms -D -i "$1" > "$work/profile.plist"
            uuid=$(plutil -extract UUID raw -o - "$work/profile.plist")
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$1" "$dir/$uuid.mobileprovision"
            done
            echo "$2=$(plutil -extract Name raw -o - "$work/profile.plist")" >> "$GITHUB_ENV"
          }
          install_profile "$work/app.mobileprovision" PHOMIC_APP_PROFILE
          install_profile "$work/widget.mobileprovision" PHOMIC_WIDGET_PROFILE
          team=$(plutil -extract TeamIdentifier.0 raw -o - "$work/profile.plist")
          echo "::add-mask::$team"
          {
            echo "PHOMIC_TEAM=$team"
            echo "PHOMIC_KEYCHAIN=$keychain"
            echo "PHOMIC_ASC_KEY=$work/AuthKey.p8"
            echo "PHOMIC_ASC_KEY_ID=$key_id"
            echo "PHOMIC_ASC_ISSUER_ID=$issuer_id"
          } >> "$GITHUB_ENV"

      - name: Archive
        if: ${{ inputs.upload }}
        run: |
          # Build number: the run number + 10. App Store Connect already has 1.0.0 (5) from before this
          # repository restarted its run count, and each upload needs a higher number.
          xcodebuild archive -project Xcode/Phomic.xcodeproj -scheme PhomicApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Phomic.xcarchive" \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 10 )) \
            DEVELOPMENT_TEAM="$PHOMIC_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PHOMIC_APP_PROFILE="$PHOMIC_APP_PROFILE" PHOMIC_WIDGET_PROFILE="$PHOMIC_WIDGET_PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $PHOMIC_KEYCHAIN"
          bash Tools/check-iphone-only.sh "$RUNNER_TEMP/Phomic.xcarchive/Products/Applications/Phomic.app"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$PHOMIC_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.nordohm.Phomic</key><string>$PHOMIC_APP_PROFILE</string>
              <key>io.github.nordohm.Phomic.PhomicWidget</key><string>$PHOMIC_WIDGET_PROFILE</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Phomic.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$PHOMIC_ASC_KEY" -authenticationKeyID "$PHOMIC_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$PHOMIC_ASC_ISSUER_ID"

      - name: Clean up
        if: ${{ always() && inputs.upload }}
        run: |
          if [ -n "${PHOMIC_KEYCHAIN:-}" ]; then security delete-keychain "$PHOMIC_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing"
