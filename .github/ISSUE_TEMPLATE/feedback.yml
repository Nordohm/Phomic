# The form behind "Send feedback" in both apps. They fill in "app" and "device" through the link
# (?template=feedback.yml&app=...&device=...), so those ids have to stay as they are.
name: Feedback
description: A problem, an idea, or anything else about Phomic.
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options:
        - A problem
        - An idea
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Tell me about it
      description: For a problem, what you did, what happened, and what you expected.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      description: If it's about one.
      multiple: true
      options:
        - Wi-Fi
        - Bluetooth
        - USB
  - type: input
    id: app
    attributes:
      label: App
      placeholder: iPhone 1.2.0, Windows 1.2.5
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iOS 27.2, iPhone 15 Pro / Windows 11 24H2
  - type: markdown
    attributes:
      value: Issues are public, so leave out anything private.
